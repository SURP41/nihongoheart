<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NihongoHeart — 心</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@google/generative-ai@0.1.0/dist/index.umd.js"></script>
</head>
<body>

    <div id="screen-splash" class="screen active">
        <div class="splash-content">
            <h1>🌸</h1>
            <h2>NihongoHeart</h2>
            <p>One step today. Fluent someday.</p>
            <button id="splash-btn" class="btn-primary">Let's Begin</button>
        </div>
    </div>

    <div id="screen-onboarding-1" class="screen">
        <h3>What should I call you?</h3>
        <input type="text" id="input-name" placeholder="Enter your name...">
        <button id="btn-save-name" class="btn-primary">Next</button>
    </div>

    <div id="screen-home" class="screen">
        <header>
            <h2 id="home-greeting">こんにちは!</h2>
            <p id="home-name">Friend</p>
        </header>
        <div class="stats-row">
            <div class="stat-card">🔥 <span id="streak-count">0</span> Day Streak</div>
            <div class="stat-card">⭐ <span id="total-xp">0</span> XP</div>
        </div>
        <div id="task-list">
            </div>
        <div id="unlock-section" style="display:none;">
            <button onclick="App.useUnlock()" class="btn-unlock">🔓 Unlock Social Media (20m)</button>
        </div>
    </div>

    <div id="screen-task" class="screen">
        <h3 id="task-screen-title">Loading Task...</h3>
        <div id="task-content"></div>
        <button id="task-done-btn" onclick="App.completeTask()" class="btn-primary">I'm Done!</button>
    </div>

    <div id="celebration" class="overlay" style="display:none;">
        <div class="cel-card">
            <h1 id="cel-emoji">🎉</h1>
            <h2 id="cel-title">Wonderful!</h2>
            <p id="cel-msg"></p>
            <div class="xp-badge">+<span id="cel-xp">0</span> XP</div>
            <button onclick="App.closeCelebration()" class="btn-primary">Continue</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
